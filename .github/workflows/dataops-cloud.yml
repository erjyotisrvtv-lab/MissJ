name: Cloud DataOps Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  dataops-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Dataset
        run: python scripts/extract_dataset.py

      - name: Run Preprocessing
        run: python scripts/preprocessing.py

      - name: Run EDA
        run: python scripts/eda.py

      - name: Upload DataOps Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataops-evidence-${{ github.run_id }}
          path: |
            logs/
            outputs/
            charts/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish GitHub Actions DataOps History
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_STATUS: ${{ job.status }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repository = os.environ["GH_REPOSITORY"]
          branch = "dataops-logs"
          path = "deployment/live_dataops.json"
          run_id = os.environ["RUN_ID"]
          url = f"https://api.github.com/repos/{repository}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MissJ-DataOps-Workflow",
          }

          def api(method, target, payload=None):
              body = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = Request(target, data=body, headers=headers, method=method)
              if body is not None:
                  request.add_header("Content-Type", "application/json")
              with urlopen(request, timeout=20) as response:
                  return json.load(response)

          for attempt in range(5):
              existing = api("GET", url + "?" + urlencode({"ref": branch}))
              document = json.loads(base64.b64decode(existing["content"]).decode("utf-8-sig"))
              runs = document.get("runs", [])
              if not isinstance(runs, list):
                  raise ValueError("Expected a runs list in live_dataops.json")
              if any(str(item.get("run_id")) == run_id and item.get("source") == "github_actions" for item in runs):
                  print(f"Workflow run {run_id} already recorded")
                  break

              runs.append({
                  "timestamp_utc": datetime.now(timezone.utc).isoformat(),
                  "status": os.environ["RUN_STATUS"].lower(),
                  "duration_seconds": 0,
                  "source": "github_actions",
                  "run_id": run_id,
              })
              document["runs"] = runs[-200:]
              encoded = base64.b64encode(json.dumps(document, indent=2).encode("utf-8")).decode("ascii")
              try:
                  api("PUT", url, {
                      "message": f"Record DataOps workflow run {run_id}",
                      "content": encoded,
                      "sha": existing["sha"],
                      "branch": branch,
                  })
                  print(f"Published DataOps workflow run {run_id} to {branch}")
                  break
              except HTTPError as error:
                  if error.code in (409, 422) and attempt < 4:
                      time.sleep(2 * (attempt + 1))
                      continue
                  raise
          else:
              raise RuntimeError("Unable to publish DataOps history after retries")
          PY
